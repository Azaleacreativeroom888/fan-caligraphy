<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>稽古日記 | 書画の道</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho:wght@400;600&family=Yuji+Boku&display=swap" rel="stylesheet">
<style>
:root{
  --sepia-dark:#5b3d22;--sepia:#8a6238;--sepia-light:#d8c09a;--paper:#f1e4c8;
  --green:#3d6b4c;--green-dark:#274a34;--green-light:#5a8a68;
  --gold:#e8d49a;--cream:#f6ecd2;--ink:#2b1d10;
  --brush:"Yuji Boku","Yuji Syuku","Hiragino Mincho ProN","Yu Mincho",serif;
  --brush2:"Yuji Syuku","Hiragino Mincho ProN","Yu Mincho",serif;
  --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--mincho);color:var(--ink);
  background:radial-gradient(ellipse at center,var(--sepia-light) 0%,#c4a577 70%,#a98456 100%);padding:18px}
.frame{max-width:1000px;margin:0 auto;background:var(--paper);
  border:14px solid var(--sepia);
  border-image:linear-gradient(135deg,#a97d4a,#6e4a28,#b88c58,#5b3d22) 1;
  outline:3px solid var(--sepia-dark);outline-offset:-24px;
  box-shadow:0 8px 30px rgba(60,35,10,.45),inset 0 0 60px rgba(138,98,56,.35);
  padding:34px 30px 26px;
  background-image:radial-gradient(circle at 20% 15%,rgba(255,255,255,.35),transparent 40%),radial-gradient(circle at 80% 85%,rgba(138,98,56,.18),transparent 45%)}
header{text-align:center;margin-bottom:18px}
.site-title{font-family:var(--brush);font-size:clamp(26px,5vw,40px);letter-spacing:.3em;color:var(--sepia-dark)}
.site-sub{font-size:13px;letter-spacing:.25em;color:var(--sepia);margin-top:4px}
nav{margin:16px 0 26px;display:flex;justify-content:center;flex-wrap:wrap;gap:8px 28px;border-top:1px solid var(--sepia);border-bottom:1px solid var(--sepia);padding:10px 0}
nav a{font-family:var(--brush2);font-size:18px;letter-spacing:.2em;color:var(--sepia-dark);text-decoration:none;padding:2px 6px;border-bottom:2px solid transparent;transition:.2s}
nav a:hover,nav a.on{color:var(--green-dark);border-bottom-color:var(--green)}

h1{font-family:var(--brush2);font-weight:400;font-size:28px;letter-spacing:.3em;color:var(--sepia-dark);text-align:center;margin:6px 0 8px}
h1::after{content:"";display:block;width:90px;height:3px;margin:10px auto 0;background:linear-gradient(90deg,transparent,var(--green),transparent)}
.intro{text-align:center;font-size:14px;color:var(--sepia);letter-spacing:.1em;margin-bottom:26px}

/* タイムライン（Twitter形式） */
.timeline{max-width:620px;margin:0 auto 40px;background:rgba(255,250,235,.5);border:1px solid var(--sepia);outline:1px solid rgba(138,98,56,.4);outline-offset:-6px}
.post{display:flex;gap:14px;padding:18px 20px;border-bottom:1px solid rgba(138,98,56,.45)}
.post:last-child{border-bottom:none}
.avatar{flex:none;width:46px;height:46px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--green-light),var(--green-dark));
  color:var(--cream);font-family:var(--brush);font-size:24px;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--gold);box-shadow:0 2px 4px rgba(0,0,0,.3)}
.body{flex:1;min-width:0}
.meta{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.name{font-family:var(--brush2);letter-spacing:.15em;font-size:16px;color:var(--sepia-dark)}
.post time{font-size:13px;color:var(--sepia);letter-spacing:.08em}
.text{font-size:15px;line-height:1.95;color:#3a2815;overflow-wrap:anywhere}

footer{text-align:center;border-top:1px solid var(--sepia);padding-top:16px;font-size:12px;letter-spacing:.2em;color:var(--sepia)}
@media(max-width:600px){
  body{padding:8px}
  .frame{padding:22px 14px 18px;border-width:10px}
  .post{padding:14px 12px;gap:10px}
  .avatar{width:38px;height:38px;font-size:20px}
}
</style>
</head>
<body>
<div class="frame">
  <header>
    <div class="site-title">書画の道</div>
    <div class="site-sub">― 書と画を学ぶ記録 ―</div>
  </header>

  <nav>
    <a href="index.html">ホーム</a>
    <a href="blog.html" class="on">稽古日記</a>
    <a href="gallery.html">ギャラリー</a>
    <a href="about.html">このサイトについて</a>
  </nav>

  <h1>稽古日記</h1>
  <p class="intro">勉強の進捗を、日付とひとことで。</p>

  <!-- 新しい投稿は一番上に追加してください -->
  <main class="timeline">
    <article class="post">
      <div class="avatar">筆</div>
      <div class="body">
        <div class="meta"><span class="name">書画の道</span><time datetime="2026-10-12">2026.10.12</time></div>
        <p class="text">（サンプル）今日から稽古日記をはじめます。まずは基本の線を毎日一枚ずつ。</p>
      </div>
    </article>
    <article class="post">
      <div class="avatar">筆</div>
      <div class="body">
        <div class="meta"><span class="name">書画の道</span><time datetime="2026-10-11">2026.10.11</time></div>
        <p class="text">（サンプル）永字八法を練習。「はらい」の抜き方がまだ固い。力を抜くのがむずかしい。</p>
      </div>
    </article>
    <article class="post">
      <div class="avatar">筆</div>
      <div class="body">
        <div class="meta"><span class="name">書画の道</span><time datetime="2026-10-10">2026.10.10</time></div>
        <p class="text">（サンプル）水墨画の濃淡の練習。墨の量を変えるだけで、同じ線でも表情が変わっておもしろい。</p>
      </div>
    </article>
  </main>

  <footer>© 2026 書画の道 ／ 一筆一筆、心をこめて</footer>
</div>
</body>
</html>
